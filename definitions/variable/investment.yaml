# Investment variables for the Infra-Ensure coupling.
# STATUS: draft from the definition session 2026-11-11.
# Investment|...        total overnight investment of the capacity built in the period (not per year)
# Annualized CAPEX|...  annuity (without FOM) of all capacity installed in the year
# Unit: Investment million EUR_2020, Annualized CAPEX million EUR_2020/yr (currency year 2020 as in OQ-34).
# No group totals. CHPs only under CHP|<fuel>; carbon capture (CC) variants count with their base
# technology. Storage includes its charger and discharger links.
# Carrier mapping and computation rules are set in the variable specs of pypsa_validation_processing.

- Investment|Electricity|Solar:
    description: Total overnight investment in solar PV (utility, tracking and rooftop), for the capacity built
      in the period.
    unit: million EUR_2020
- Investment|Electricity|Wind:
    description: Total overnight investment in wind power (onshore and offshore), for the capacity built in
      the period.
    unit: million EUR_2020
- Investment|Electricity|Biomass:
    description: Total overnight investment in biomass power plants without CHPs (none in the AT network), for
      the capacity built in the period.
    unit: million EUR_2020
- Investment|Electricity|Hydro:

# Secondary energy variables (electricity generation mix, district heat supply) for the
# Infra-Ensure coupling.
# STATUS: draft from the definition session 2026-11-11.
#
# Secondary Energy|Electricity|...
#   Coal, Oil, Solar, Wind, Hydro, Biomass, Waste: copied from the common definitions of
#   energy-scenarios-at-workflow (definitions/variable/electricity-generation.yaml, commit 7298df9),
#   template Secondary Energy|Electricity|{Electricity Generation by Source} expanded by nomenclature.
#   Biomass is solid biomass only (common definition); biogas is in Other.
#   Gas Grid Mix and Other: new sources, not in the common definitions.
#   Electricity of CHPs is counted under the fuel of the CHP (as pypsa-de get_secondary_energy).
#   Unit: TWh, as in the common definitions.
#
# Secondary Energy|District Heating|...
#   New variables, not in the common definitions. Heat output supplied to district heating
#   (urban central heat) grids per technology group, as pypsa-de Secondary Energy|Heat|...
#   District Heating|{Electricity, Oil, Gas Grid Mix, Biomass, Other}: heat-only technologies;
#   they MUST NOT contain heat of CHPs.
#   District Heating|CHP|{Coal, Oil, Gas Grid Mix, Waste, Biomass, Other}: heat of CHPs, split by
#   the fuel of the CHP, same sources as the electricity mix (owner, 2026-11-11).
#   Biomass is solid biomass only, as for electricity; heat of biogas and hydrogen CHPs is in CHP|Other.
#   Unit: TWh, as the Secondary Energy variables of the common definitions.
#
# No totals. Accounting rules are set in the variable specs of pypsa_validation_processing.

- Secondary Energy|Electricity|Coal:
    description: Total net generation of electricity from coal
    unit: TWh
- Secondary Energy|Electricity|Oil:
    description: Total net generation of electricity from oil
    unit: TWh
- Secondary Energy|Electricity|Gas Grid Mix:
    description: Total net generation of electricity from methane from the gas grid, whatever its
      origin (fossil natural gas, biomethane and synthetic methane)
    unit: TWh
- Secondary Energy|Electricity|Solar:
    description: Total net generation of electricity from solar photovoltaics (PV)
    unit: TWh
- Secondary Energy|Electricity|Wind:
    description: Total net generation of electricity from wind
    unit: TWh
- Secondary Energy|Electricity|Hydro:
    description: Total net generation of electricity from hydropower
    unit: TWh
- Secondary Energy|Electricity|Biomass:
    description: Total net generation of electricity from solid biomass
    unit: TWh
- Secondary Energy|Electricity|Waste:
    description: Total net generation of electricity from burning of waste
    unit: TWh
- Secondary Energy|Electricity|Other:
    description: Total net generation of electricity from all sources not reported under coal, oil,
      gas grid mix, solar, wind, hydro, solid biomass or waste (e.g. biogas, hydrogen, methanol),
      excluding electricity storage
    unit: TWh
- Secondary Energy|District Heating|Electricity:
    description: Heat supplied to district heating grids by heat pumps and resistive heaters
    unit: TWh
- Secondary Energy|District Heating|Oil:
    description: Heat supplied to district heating grids by oil boilers, excluding combined heat and
      power plants (CHPs)
    unit: TWh
- Secondary Energy|District Heating|Gas Grid Mix:
    description: Heat supplied to district heating grids by boilers fired with methane from the gas grid,
      whatever its origin (fossil natural gas, biomethane and synthetic methane), excluding combined
      heat and power plants (CHPs)
    unit: TWh
- Secondary Energy|District Heating|Biomass:
    description: Heat supplied to district heating grids by solid biomass boilers, excluding combined
      heat and power plants (CHPs)
    unit: TWh
- Secondary Energy|District Heating|Other:
    description: Heat supplied to district heating grids by all heat-only sources not reported under
      electricity, oil, gas grid mix or solid biomass (e.g. solar thermal, waste heat of fuel synthesis
      and electrolysis), excluding combined heat and power plants (CHPs) and thermal storage
    unit: TWh
- Secondary Energy|District Heating|CHP|Coal:
    description: Heat supplied to district heating grids by coal-fired combined heat and power plants
      (CHPs)
    unit: TWh
- Secondary Energy|District Heating|CHP|Oil:
    description: Heat supplied to district heating grids by oil-fired combined heat and power plants
      (CHPs)
    unit: TWh
- Secondary Energy|District Heating|CHP|Gas Grid Mix:
    description: Heat supplied to district heating grids by combined heat and power plants (CHPs) fired
      with methane from the gas grid, whatever its origin (fossil natural gas, biomethane and synthetic
      methane)
    unit: TWh
- Secondary Energy|District Heating|CHP|Waste:
    description: Heat supplied to district heating grids by waste-fired combined heat and power plants
      (CHPs)
    unit: TWh
- Secondary Energy|District Heating|CHP|Biomass:
    description: Heat supplied to district heating grids by solid biomass combined heat and power plants
      (CHPs)
    unit: TWh
- Secondary Energy|District Heating|CHP|Other:
    description: Heat supplied to district heating grids by combined heat and power plants (CHPs) fired
      with fuels not reported under coal, oil, gas grid mix, waste or solid biomass (e.g. hydrogen,
      biogas)
    unit: TWh
